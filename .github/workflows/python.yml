name: Reusable Docker Build and Scan Workflow

on:
  workflow_call:
    inputs:
      docker-image-name:
        description: 'Docker image name (without registry)'
        required: true
        type: string
      docker-registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: 'ghcr.io'
      docker-platforms:
        description: 'Target platforms for Docker build'
        required: false
        type: string
        default: 'linux/arm64,linux/amd64'
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      build-context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      trivy-severity:
        description: 'Trivy severity levels to check'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      artifact-retention-days:
        description: 'Artifact retention days for reports'
        required: false
        type: number
        default: 30
      sbom-retention-days:
        description: 'SBOM retention days'
        required: false
        type: number
        default: 90
      fail-on-vulnerabilities:
        description: 'Whether to fail the workflow on vulnerabilities'
        required: false
        type: boolean
        default: true
      ignore-unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      exit-code:
        description: "Exit code to use when vulnerabilities are found. Set to '0' to report vulnerabilities without failing the build (differs from fail-on-vulnerabilities which skips the check entirely)."
        required: false
        type: string
        default: '1'
    secrets:
      registry-username:
        description: 'Docker registry username (defaults to github.repository_owner)'
        required: false
      registry-password:
        description: 'Docker registry password/token (defaults to github.token for ghcr.io)'
        required: false

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync

      - name: Set VIRTUAL_ENV
        run: echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: Export requirements.txt
        run: uv export --format requirements-txt --output-file requirements.txt

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.build-context }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: '${{ inputs.trivy-severity }}'

      - name: Upload Trivy SARIF results as artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.build-context }}'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Generate license report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.build-context }}'
          format: 'json'
          output: 'licenses.json'
          scanners: 'license'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: ${{ inputs.sbom-retention-days }}

      - name: Upload reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-reports
          path: |
            licenses.json
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Check vulnerabilities
        uses: aquasecurity/trivy-action@master
        if: ${{ inputs.fail-on-vulnerabilities }}
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.build-context }}'
          format: 'table'
          exit-code: '${{ inputs.exit-code }}'
          severity: '${{ inputs.trivy-severity }}'
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

  trivy-scan-docker:
    runs-on: ubuntu-latest
    needs: trivy-scan
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ inputs.docker-image-name }}:latest -f ${{ inputs.dockerfile-path }} ${{ inputs.build-context }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ inputs.docker-image-name }}:latest'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: '${{ inputs.trivy-severity }}'

      - name: Upload Trivy SARIF results as artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ inputs.docker-image-name }}:latest'
          format: 'spdx-json'
          output: 'sbom-image.spdx.json'

      - name: Generate license report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ inputs.docker-image-name }}:latest'
          format: 'json'
          output: 'licenses-image.json'
          scanners: 'license'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom-image-spdx
          path: sbom-image.spdx.json
          retention-days: ${{ inputs.sbom-retention-days }}

      - name: Upload reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-image-reports
          path: |
            licenses-image.json
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Check vulnerabilities
        uses: aquasecurity/trivy-action@master
        if: ${{ inputs.fail-on-vulnerabilities }}
        with:
          scan-type: 'image'
          scan-ref: '${{ inputs.docker-image-name }}:latest'
          format: 'table'
          exit-code: '${{ inputs.exit-code }}'
          severity: '${{ inputs.trivy-severity }}'
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

  docker-build:
    runs-on: ubuntu-latest
    needs: trivy-scan-docker
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.registry-username || github.repository_owner }}
          password: ${{ secrets.registry-password || github.token }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ inputs.docker-platforms }}
          push: true
          tags: ${{ inputs.docker-registry }}/${{ github.repository_owner }}/${{ inputs.docker-image-name }}:latest

      # Commenting as Attestations are only available in Enterprise Cloud Plan
      # - name: Generate artifact attestation
      #   uses: actions/attest-build-provenance@v1
      #   with:
      #     subject-name: ${{ inputs.docker-registry }}/${{ github.repository_owner }}/${{ inputs.docker-image-name }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: false
